<g class="v0"><text class="t" x="16.0" y="64" textLength="428.4" xml:space="preserve"><tspan fill="#3fb950">$ </tspan><tspan fill="#8b949e"># which keys differ between dev.env and prod.env?</tspan></text><g class="k2" transform="translate(411.6,0)"><rect x="32.8" y="50" width="726.2" height="20" fill="#0d1117"/><rect class="c1" x="32.8" y="52" width="8.4" height="16" fill="#e6edf3" opacity="0"/></g></g>
<g class="v3"><text class="t" x="16.0" y="84" textLength="369.6" xml:space="preserve"><tspan fill="#3fb950">$ </tspan>envdiff examples/dev.env examples/prod.env</text><g class="k5" transform="translate(352.8,0)"><rect x="32.8" y="70" width="726.2" height="20" fill="#0d1117"/><rect class="c4" x="32.8" y="72" width="8.4" height="16" fill="#e6edf3" opacity="0"/></g></g>
<g class="v6"><text class="t" x="16.0" y="104" textLength="201.6" xml:space="preserve">Missing in prod.env (2):</text></g>
<g class="v7"><text class="t" x="32.8" y="124" textLength="58.8" xml:space="preserve">- DEBUG</text></g>
<g class="v8"><text class="t" x="32.8" y="144" textLength="100.8" xml:space="preserve">- SENTRY_DSN</text></g>
<g class="v9"><text class="t" x="16.0" y="164" textLength="193.2" xml:space="preserve">Missing in dev.env (1):</text></g>
<g class="v10"><text class="t" x="32.8" y="184" textLength="92.4" xml:space="preserve">+ REDIS_URL</text></g>
<g class="v11"><text class="t" x="16.0" y="204" textLength="176.4" xml:space="preserve">Different values (2):</text></g>
<g class="v12"><text class="t" x="32.8" y="224" textLength="117.6" xml:space="preserve">~ DATABASE_URL</text></g>
<g class="v13"><text class="t" x="32.8" y="244" textLength="92.4" xml:space="preserve">~ LOG_LEVEL</text></g>
<g class="v14"><text class="t" x="16.0" y="264" textLength="109.2" xml:space="preserve">2 keys match.</text></g>
<g class="v15"><text class="t" x="16.0" y="284" textLength="445.2" xml:space="preserve"><tspan fill="#3fb950">$ </tspan>envdiff examples/dev.env examples/prod.env --values</text><g class="k17" transform="translate(428.4,0)"><rect x="32.8" y="270" width="726.2" height="20" fill="#0d1117"/><rect class="c16" x="32.8" y="272" width="8.4" height="16" fill="#e6edf3" opacity="0"/></g></g>
